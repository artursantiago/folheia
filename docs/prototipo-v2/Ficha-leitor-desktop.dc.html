<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Folheia · ficha no leitor, livro aberto por endereço, desktop</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="folheia.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Atkinson+Hyperlegible+Next:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="par" style="width: 2608px; height: 800px;">
<sc-for list="{{temas}}" as="t" hint-placeholder-count="2">
<div class="fx {{t.cls}}" style="width: 1280px; height: 800px; flex: none;">
  <sc-if value="{{t.escuro}}" hint-placeholder-val="{{false}}"><div class="lamp"></div></sc-if>
  <div class="livro" style="left: 215px; top: 74px;">
    <div class="pag esq" style="width: 425px; height: 610px;"></div>
    <div class="pag dir" style="width: 425px; height: 610px;"></div>
  </div>
  <div class="veu"></div>

  <div class="dialogo" role="dialog" aria-label="Ficha do livro" style="width: 660px;">
    <div class="ficha" style="padding-bottom: 34px;">
      <div class="ficha-h" style="min-height: 54px;">
        <span class="tag">Ficha catalográfica</span>
        <div class="row" style="gap: 10px;"><span class="tombo">Fora do acervo</span><button class="btn ib" aria-label="Fechar ficha" style="margin-right: -12px;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
      </div>
      <div style="padding: 16px 40px 0;">
        <div class="cat">
          <div><span class="serif" style="font-size: 18px;">Fon-Fon!</span> : semanario alegre, politico,</div>
          <div class="in">critico e espusiante. — Rio de Janeiro, 1913.</div>
          <div class="in">Anno VII, nº 12. 48 p. : il. — PDF · 31 MB.</div>
          <div class="in">Idioma: português. Leitura: esq. → dir.</div>
          <div class="in">Endereço: exemplo.org/fon-fon-1913-12.pdf</div>
          <div class="in muted">Lido até a pág. 14.</div>
        </div>
        <div class="row" style="gap: 10px; margin-top: 22px; flex-wrap: wrap;">
          <button class="btn pri"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>Guardar no acervo</button>
          <button class="btn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>Guardar cópia no aparelho</button>
          <button class="btn ghost">Exportar a ficha</button>
        </div>
      </div>
      <div class="furo"></div>
    </div>
  </div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2608,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return { temas: [{ cls: '', escuro: false }, { cls: 'dark', escuro: true }] };
}
}
</script>
</body>
</html>
