<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Folheia · acervo com estantes, celular</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="folheia.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Atkinson+Hyperlegible+Next:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="par" style="width: 828px; height: 844px;">
<sc-for list="{{temas}}" as="t" hint-placeholder-count="2">
<div class="fx {{t.cls}}" style="width: 390px; height: 844px; flex: none;">
  <main class="m-front">
    <header class="front-h">
      <h1 class="serif" style="margin: 0; font-size: 24px;">Acervo</h1>
      <div class="row" style="gap: 4px; margin-right: -6px;">
        <button class="btn ib" aria-label="Buscar no acervo"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg></button>
        <button class="btn pri" style="padding: 0 14px;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Adicionar</button>
      </div>
    </header>

    <nav class="estantes" aria-label="Estantes" style="padding: 0 12px;">
      <a class="est on" href="#" aria-current="page">Quadrinhos <span class="n">9</span></a>
      <a class="est" href="#">Clássicos <span class="n">11</span></a>
      <a class="est" href="#">Mangá <span class="n">3</span></a>
      <a class="est" href="#">Revistas <span class="n">6</span></a>
      <a class="est sis" href="#">Por catalogar <span class="n">4</span></a>
      <button class="est mais" aria-label="Nova estante"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
      <button class="est mais" aria-label="Organizar estantes"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button>
    </nav>

    <div class="row" style="justify-content: space-between; padding: 6px 12px 0 6px;">
      <div class="row">
        <button class="chip" style="font-size: 13.5px; padding: 0 8px;"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M4 17l3 3 3-3M14 6h7M14 11h5M14 16h3"></path></svg>Última leitura</button>
        <button class="btn ib" aria-label="Filtrar"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16l-6 7v6l-4 2v-8z"></path></svg></button>
      </div>
      <div class="exib" role="group" aria-label="Exibição" style="border: 0; padding: 0; gap: 0;">
        <button class="btn ib on" aria-label="Capas" aria-pressed="true"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h6v8H4zM14 3h6v8h-6zM4 13h6v8H4zM14 13h6v8h-6z"></path></svg></button>
        <button class="btn ib" aria-label="Lista" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h4v6H4zM4 14h4v6H4zM11 6h9M11 9h6M11 16h9M11 19h6"></path></svg></button>
        <button class="btn ib" aria-label="Fichário" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h18v11H3zM5 6h14M7 3h10M7 13h6M7 16h10"></path></svg></button>
        <button class="btn ib" aria-label="Lombadas" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h3v16H4zM9 6h3v14H9zM14.2 5.6l2.9-.8 3.6 14.4-2.9.8zM2 21h20"></path></svg></button>
      </div>
    </div>

    <section style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 14px; row-gap: 22px; padding: 18px 16px 0;">
      <sc-for list="{{livros}}" as="b" hint-placeholder-count="9">
        <div class="cel" style="gap: 6px;">
          <div class="capa-box {{b.cls}}">
            <a class="capa" href="#" aria-label="Continuar {{b.titulo}}" style="height: 162px; padding: 10px 10px 9px 13px; background: {{b.bg}}; color: {{b.ink}};">
              <span class="t" style="font-size: 12.5px;">{{b.titulo}}</span>
              <span class="a" style="font-size: 8.5px;">{{b.autor}}</span>
            </a>
            <sc-if value="{{b.prog}}" hint-placeholder-val="{{false}}"><div class="fita"><i style="width: {{b.pct}};"></i></div></sc-if>
            <sc-if value="{{b.novo}}" hint-placeholder-val="{{false}}"><span class="selo-novo" style="left: 8px;">novo</span></sc-if>
            <sc-if value="{{b.lido}}" hint-placeholder-val="{{false}}"><span class="carimbo capa-carimbo" style="font-size: 10.5px;">Lido</span></sc-if>
            <sc-if value="{{b.ausente}}" hint-placeholder-val="{{false}}"><span class="carimbo ink" style="font-size: 10px; padding: 2px 6px; white-space: normal; width: 92px; text-align: center; line-height: 1.3;">Exemplar ausente</span></sc-if>
            <button class="capa-ficha" aria-label="Ficha: {{b.titulo}}"><span style="width: 24px; height: 24px;"><svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px;"><rect x="3" y="5" width="18" height="14" rx="1"></rect><path d="M7 9h10M7 13h6"></path></svg></span></button>
          </div>
          <div>
            <div class="cel-t" style="font-size: 13px;">{{b.titulo}}</div>
            <div class="cel-m" style="font-size: 10.5px; letter-spacing: 0;">{{b.meta}}</div>
          </div>
        </div>
      </sc-for>
    </section>
  </main>

  <div class="m-edge" style="bottom: 88px;"></div>
  <div class="m-edge" style="bottom: 85px;"></div>
  <nav class="m-abas" aria-label="Seções">
    <a class="m-aba on" href="Estantes-celular.dc.html" aria-current="page"><span>Acervo</span></a>
    <a class="m-aba" href="#">Leituras</a>
    <a class="m-aba" href="#">Catálogos</a>
    <a class="m-aba" href="#">Mais</a>
  </nav>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":828,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const L = (o) => Object.assign({ ink: '#F6EFE2', cls: '', prog: false, novo: false, lido: false, ausente: false }, o);
return {
temas: [{ cls: '' }, { cls: 'dark' }],
livros: [
L({ titulo: 'Little Nemo in Slumberland, v. 1', autor: 'Winsor McCay', bg: '#2E4A5A', prog: true, pct: '22%', meta: 'pág. 45/200 · CBZ' }),
L({ titulo: 'Hokusai Manga, v. 1', autor: 'Katsushika Hokusai', bg: '#D8C59B', ink: '#2B2420', prog: true, pct: '12%', meta: 'pág. 12/96 · CBZ' }),
L({ titulo: 'O Tico-Tico, nº 1', autor: 'Revista · 1905', bg: '#B4532A', lido: true, meta: 'PDF' }),
L({ titulo: 'Krazy Kat', autor: 'George Herriman', bg: '#3E5641', cls: 'ausente', ausente: true, meta: 'CBZ' }),
L({ titulo: 'Little Nemo in Slumberland, v. 2', autor: 'Winsor McCay', bg: '#355B6E', novo: true, meta: 'CBZ' }),
L({ titulo: 'Little Nemo in Slumberland, v. 3', autor: 'Winsor McCay', bg: '#2F5266', novo: true, meta: 'CBZ' }),
L({ titulo: 'Hokusai Manga, v. 2', autor: 'Katsushika Hokusai', bg: '#CDB98C', ink: '#2B2420', meta: 'CBZ' }),
L({ titulo: 'Hokusai Manga, v. 3', autor: 'Katsushika Hokusai', bg: '#C4AE80', ink: '#2B2420', meta: 'CBZ' }),
L({ titulo: 'O Tico-Tico, nº 2', autor: 'Revista · 1905', bg: '#A84C27', meta: 'PDF' })
]
};
}
}
</script>
</body>
</html>
