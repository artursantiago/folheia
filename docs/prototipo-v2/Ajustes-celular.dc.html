<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Folheia · menu de ajustes do leitor, celular</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="folheia.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Atkinson+Hyperlegible+Next:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="par" style="width: 828px; height: 844px;">
<sc-for list="{{temas}}" as="t" hint-placeholder-count="2">
<div class="fx {{t.cls}}" style="width: 390px; height: 844px; flex: none;">
  <sc-if value="{{t.escuro}}" hint-placeholder-val="{{false}}"><div class="lamp"></div></sc-if>
  <div class="livro" style="left: 20px; top: 108px;">
    <div class="pag dir" style="width: 350px; height: 520px; padding: 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: 150px 170px 150px; gap: 8px;">
      <div style="grid-column: span 2; background: #2E4A5A; border: 2px solid #2B2420;"></div>
      <div style="background: #D8C59B; border: 2px solid #2B2420;"></div>
      <div style="background: #B4532A; border: 2px solid #2B2420;"></div>
      <div style="grid-column: span 2; background: #6F5585; border: 2px solid #2B2420;"></div>
    </div>
  </div>
  <div class="veu" style="z-index: 2;"></div>

  <section class="gaveta" role="dialog" aria-label="Ajustes de leitura">
    <span class="alca" aria-hidden="true"></span>
    <div class="ficha-h" style="padding: 0 8px 0 20px;"><span class="serif" style="font-size: 19px;">Ajustes de leitura</span><a class="btn ib" href="Leitor-celular.dc.html" aria-label="Fechar ajustes"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a></div>
    <div class="item" style="padding: 0 20px;"><span>Páginas</span><div class="seg"><span class="on">Auto</span><span>Uma</span><span>Duas</span></div></div>
    <div class="item" style="padding: 0 20px;"><div class="col"><span>Capa sozinha</span><span class="muted" style="font-size: 13px;">Como num livro fechado</span></div><span class="sw on" role="switch" aria-checked="true"></span></div>
    <div class="item" style="padding: 10px 20px; flex-direction: column; align-items: flex-start; gap: 8px;"><span>Sentido da leitura</span><div class="seg"><span class="on">Esq. → dir.</span><span>Dir. → esq.</span></div></div>
    <div class="item" style="padding: 10px 20px; flex-direction: column; align-items: flex-start; gap: 8px;"><span>Barra no modo imersivo</span><div class="seg"><span class="on">Fixa</span><span>Some sozinha</span></div></div>
    <div class="item" style="padding: 0 20px;"><span>Tema</span><div class="seg"><span class="on">Sistema</span><span>Claro</span><span>Escuro</span></div></div>
    <div class="item" style="padding: 0 20px;"><span>Sons</span><span class="sw on" role="switch" aria-checked="true"></span></div>
    <div class="item" style="padding: 0 12px 0 20px; background: var(--paper);"><span class="muted" style="font-size: 13px;">Algo deu errado?</span><button class="btn ghost" style="height: 44px; padding: 0 8px; text-decoration: underline;">Copiar diagnóstico</button></div>
  </section>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":828,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { temas: [{ cls: '', escuro: false }, { cls: 'dark', escuro: true }] };
}
}
</script>
</body>
</html>
